name: Instagram 投稿予定の確認

on:
  schedule:
    # 毎朝 8:07〜11:52（日本時間）に15分おきに起動し、その日の19時に投稿する予定の写真と文章を Issue でお知らせ
    # （同じ日のお知らせは1回だけ。GitHub の遅れで 18時以降に起動した回は何もしません）
    - cron: "7,22,37,52 23 * * *"
    - cron: "7,22,37,52 0-2 * * *"
  workflow_dispatch:
    inputs:
      timer:
        description: "外部タイマーからの起動（自動実行と同じ扱い）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: instagram
      - name: git の準備
        run: |
          git config user.name "instagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 今日の投稿文を作る
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW: "1"
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.timer && '1' || '' }}
          PREVIEW_OUT: ${{ runner.temp }}/preview.json
          CATCH_STYLE: ${{ vars.IG_CATCH_STYLE }}
        run: node instagram/post.mjs
      - name: 投稿文を保存
        run: |
          git add instagram/images instagram/processed
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instagram 今日の投稿文（確認用）"
          git pull --rebase
          git push
      - name: Issue でお知らせ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ runner.temp }}/preview.json"
          if [ ! -f "$f" ]; then echo "今日の投稿予定はありません"; exit 0; fi
          gh label create instagram-preview --color E4405F --description "Instagram 投稿予定" --force
          title="$(node -e 'const p=require(process.argv[1]);const [y,m,d]=p.date.split("-");console.log(`Instagram 投稿予定 ${+m}/${+d} 19時`)' "$f")"
          node instagram/preview-issue.mjs "$f" "${{ github.repository }}" > "${{ runner.temp }}/body.md"
          if gh issue list --label instagram-preview --state open --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "今日のお知らせは送信済みです"; exit 0
          fi
          gh issue create --title "$title" --label instagram-preview --body-file "${{ runner.temp }}/body.md"
