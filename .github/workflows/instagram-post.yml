name: Instagram 自動投稿

on:
  schedule:
    # 毎日 19:00（日本時間）= 10:00 UTC に起動。
    # 月・水・金・日はいつもの投稿、それ以外の日は「日付つき」の写真があるときだけ投稿します。
    # GitHub の混雑で数分〜数十分遅れることがあります
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン（チェックだけで実際には投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: instagram
      - name: git の準備
        run: |
          git config user.name "instagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 投稿カレンダーのフォルダを先まで作る
        run: node instagram/calendar.mjs
      - name: 投稿する
        id: post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node instagram/post.mjs
      - name: 投稿の記録とカレンダーを保存
        if: always()
        run: |
          git add instagram/posted.json instagram/images
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Instagram 投稿の記録・カレンダーを更新"
          git pull --rebase
          git push
      - name: 投稿予定の Issue を閉じる
        if: steps.post.outputs.posted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label instagram-preview --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "投稿しました。" || true
          done
