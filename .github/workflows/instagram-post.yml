name: Instagram 自動投稿

on:
  schedule:
    # 月・水・金・日 の 19:00（日本時間）= 10:00 UTC
    # GitHub の混雑で数分〜数十分遅れることがあります
    - cron: "0 10 * * 0,1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン（チェックだけで実際には投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: instagram
      - name: git の準備
        run: |
          git config user.name "instagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 投稿する
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node instagram/post.mjs
      - name: 投稿の記録を保存
        run: |
          if git diff --quiet -- instagram/posted.json; then exit 0; fi
          git add instagram/posted.json
          git commit -m "Instagram に投稿しました"
          git pull --rebase
          git push
