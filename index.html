<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repeater Fair 2026 – 予約フォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, deleteDoc, doc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ── Firebase 設定 ──────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyA9KXYdE8UQt-gkhsbbcFo4AC3YLSYZ30c",
      authDomain: "salon-resv-2026.firebaseapp.com",
      projectId: "salon-resv-2026",
      storageBucket: "salon-resv-2026.firebasestorage.app",
      messagingSenderId: "1027723960257",
      appId: "1:1027723960257:web:40b7bb82fc1e9c86fe9940",
      measurementId: "G-CH46FXGT1P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID = "salon-resv-2026";

    const PRODUCTS = [
      { id: "W_SH_1000",  name: "シャンプー ［W］オリジナル（乾燥ケア）1000ml",         price: 7040, img: "w-shampoo.jpg" },
      { id: "W_TR_1000",  name: "トリートメント ［W］オリジナル（乾燥ケア）1000ml",      price: 7740, img: "w-treatment.jpg" },
      { id: "OK_SH_1000", name: "シャンプー ［オイルK］オリジナル（うねりケア）1000ml",  price: 7210, img: "w-shampoo.jpg" },
      { id: "OK_TR_1000", name: "トリートメント ［オイルK］オリジナル（うねりケア）1000ml", price: 8440, img: "w-treatment.jpg" },
      { id: "06",         name: "アウトバストリートメント 06  100ml",                   price: 1760, img: "outbath06.jpg" },
      { id: "W_SH_700",   name: "シャンプー ［W］オリジナル（乾燥ケア）700ml",          price: 6280, img: "oilk-shampoo.jpg" },
      { id: "W_TR_700",   name: "トリートメント ［W］オリジナル（乾燥ケア）700ml",       price: 6770, img: "oilk-treatment.jpg" },
      { id: "OK_SH_700",  name: "シャンプー ［オイルK］オリジナル（うねりケア）700ml",   price: 6360, img: "oilk-shampoo.jpg" },
      { id: "OK_TR_700",  name: "トリートメント ［オイルK］オリジナル（うねりケア）700ml", price: 7390, img: "oilk-treatment.jpg" },
    ];

    // ── 状態 ───────────────────────────────────────────────────
    let currentUser = null;
    let quantities  = Object.fromEntries(PRODUCTS.map(p => [p.id, 0]));
    let reservations = [];
    let adminUnlocked = false;
    const ADMIN_PASSWORD = "joint0011";

    // ── LIFF 初期化 ────────────────────────────────────────────
    const LIFF_ID = "2010337371-g1ra1deL";
    let liffProfile = null;
    let liffInitialized = false;
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        liffInitialized = true;
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        return liff.getProfile();
      })
      .then(profile => {
        if (profile) liffProfile = profile;
      })
      .catch(e => console.warn("LIFF init error:", e));

    // ── Auth 初期化 ────────────────────────────────────────────
    signInAnonymously(auth);
    onAuthStateChanged(auth, u => { currentUser = u; });

    // ── Firestore リッスン（管理画面用）──────────────────────
    const resRef = collection(db, "artifacts", APP_ID, "public", "data", "reservations");
    onSnapshot(resRef, snap => {
      reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAdmin();
    });

    // ── ヘルパー ───────────────────────────────────────────────
    const total = () => PRODUCTS.reduce((s,p) => s + p.price * quantities[p.id], 0);
    const count = () => Object.values(quantities).reduce((a,b) => a+b, 0);
    const fmt   = n => n.toLocaleString("ja-JP");

    // ── 予約送信 ───────────────────────────────────────────────
    window.submitReservation = async () => {
      const name = document.getElementById("customerName").value.trim();
      if (!currentUser || count() === 0 || !name) return;
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").textContent = "送信中…";

      const items = PRODUCTS
        .filter(p => quantities[p.id] > 0)
        .map(p => ({
          productId: p.id, productName: p.name,
          price: p.price, quantity: quantities[p.id],
          subtotal: p.price * quantities[p.id]
        }));

      try {
        await addDoc(resRef, {
          customerName: name, items,
          totalPrice: total(), totalItems: count(),
          timestamp: serverTimestamp(), userId: currentUser.uid,
          lineUserId: liffProfile?.userId || null
        });

        // ── LINE自動メッセージ送信 ────────────────────────────
        try {
          if (liffInitialized && liff.isInClient()) {
            const itemLines = items.map(it =>
              `・${it.productName}　×${it.quantity}　¥${it.subtotal.toLocaleString("ja-JP")}`
            ).join("\n");
            const msg = `【ご予約確認】Repeater Fair 2026\n\n${name} 様\nご予約ありがとうございます！\n\n─────────────\n${itemLines}\n─────────────\n合計：¥${total().toLocaleString("ja-JP")}\n\n7月5日以降のご来店時にお渡しいたします。\nお会いできるのを楽しみにしております！\njoint club`;
            await liff.sendMessages([{ type: "text", text: msg }]);
          }
        } catch (liffErr) {
          console.warn("LINE message send failed:", liffErr);
        }

        showThanks();
      } catch (e) {
        alert("送信エラーが発生しました。もう一度お試しください。");
        console.error(e);
      } finally {
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("submitBtn").textContent = "この内容で予約を確定する";
      }
    };

    // ── 数量変更 ───────────────────────────────────────────────
    window.updateQty = (id, delta) => {
      quantities[id] = Math.max(0, Math.min(10, quantities[id] + delta));
      renderForm();
    };

    // ── タブ切替 ───────────────────────────────────────────────
    window.showTab = tab => {
      if (tab === "admin" && !adminUnlocked) {
        document.getElementById("customerView").classList.add("hidden");
        document.getElementById("adminView").classList.add("hidden");
        document.getElementById("passwordView").classList.remove("hidden");
        document.getElementById("tabCustomer").classList.remove("bg-white","shadow-sm","text-slate-800");
        document.getElementById("tabCustomer").classList.add("text-slate-500");
        document.getElementById("tabAdmin").classList.add("bg-white","shadow-sm","text-slate-800");
        document.getElementById("tabAdmin").classList.remove("text-slate-500");
        return;
      }
      document.getElementById("passwordView").classList.add("hidden");
      document.getElementById("customerView").classList.toggle("hidden", tab !== "customer");
      document.getElementById("adminView").classList.toggle("hidden",   tab !== "admin");
      document.getElementById("tabCustomer").classList.toggle("bg-white",  tab === "customer");
      document.getElementById("tabCustomer").classList.toggle("shadow-sm", tab === "customer");
      document.getElementById("tabCustomer").classList.toggle("text-slate-800", tab === "customer");
      document.getElementById("tabCustomer").classList.toggle("text-slate-500", tab !== "customer");
      document.getElementById("tabAdmin").classList.toggle("bg-white",  tab === "admin");
      document.getElementById("tabAdmin").classList.toggle("shadow-sm", tab === "admin");
      document.getElementById("tabAdmin").classList.toggle("text-slate-800", tab === "admin");
      document.getElementById("tabAdmin").classList.toggle("text-slate-500", tab !== "admin");
      if (tab === "admin") renderAdmin();
    };

    // ── パスワード認証 ─────────────────────────────────────────
    window.checkPassword = () => {
      const input = document.getElementById("pwInput").value;
      if (input === ADMIN_PASSWORD) {
        adminUnlocked = true;
        document.getElementById("pwError").classList.add("hidden");
        showTab("admin");
      } else {
        document.getElementById("pwError").classList.remove("hidden");
        document.getElementById("pwInput").value = "";
      }
    };

    // ── サンクス画面 ──────────────────────────────────────────
    function showThanks() {
      document.getElementById("formView").classList.add("hidden");
      document.getElementById("thanksView").classList.remove("hidden");
      quantities = Object.fromEntries(PRODUCTS.map(p => [p.id, 0]));
      document.getElementById("customerName").value = "";
    }

    window.closeThanks = () => {
      document.getElementById("thanksView").classList.add("hidden");
      document.getElementById("formView").classList.remove("hidden");
      renderForm();
    };

    // ── 予約フォーム描画 ──────────────────────────────────────
    function renderForm() {
      // 商品リスト
      const list = document.getElementById("productList");
      list.innerHTML = PRODUCTS.map(p => `
        <div class="rounded-2xl border transition-all overflow-hidden flex ${quantities[p.id] > 0 ? "border-slate-800 bg-slate-50" : "border-slate-100 bg-white"}">
          <img src="${p.img}" alt="${p.name}"
            class="w-24 h-24 object-cover object-center flex-shrink-0" />
          <div class="p-3 flex flex-col justify-between flex-1">
            <div>
              <h4 class="font-bold text-slate-800 text-xs leading-tight">${p.name}</h4>
              <p class="text-xs text-slate-500 mt-1">¥${fmt(p.price)}</p>
            </div>
            <div class="flex items-center justify-end gap-3 mt-2">
              <button onclick="updateQty('${p.id}',-1)"
                class="p-1.5 rounded-full border ${quantities[p.id] > 0 ? "border-slate-300 text-slate-800" : "border-slate-100 text-slate-200"}">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
              </button>
              <span class="w-6 text-center font-bold text-base">${quantities[p.id]}</span>
              <button onclick="updateQty('${p.id}',1)"
                class="p-1.5 rounded-full border border-slate-300 text-slate-800">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              </button>
            </div>
          </div>
        </div>
      `).join("");

      // 合計表示
      document.getElementById("totalPrice").textContent = `¥${fmt(total())}`;
      document.getElementById("totalCount").textContent = `${count()}本`;

      // ボタン制御
      const btn = document.getElementById("submitBtn");
      const name = document.getElementById("customerName").value.trim();
      btn.disabled = count() === 0 || !name;
    }

    // ── 管理画面描画 ──────────────────────────────────────────
    function renderAdmin() {
      // 集計カード
      const statsEl = document.getElementById("statsGrid");
      statsEl.innerHTML = PRODUCTS.map(p => {
        const qty = reservations.reduce((acc, r) => {
          const item = r.items?.find(i => i.productId === p.id);
          return acc + (item ? item.quantity : 0);
        }, 0);
        return `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${p.id}</p>
            <div class="flex items-baseline gap-1 mt-1">
              <span class="text-3xl font-bold text-slate-800">${qty}</span>
              <span class="text-xs text-slate-500 font-medium">本</span>
            </div>
            <p class="text-xs text-slate-400 mt-2 font-medium">売上予測: ¥${fmt(qty * p.price)}</p>
          </div>
        `;
      }).join("");

      // 予約台帳
      const tbody = document.getElementById("reservationTable");
      if (reservations.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="px-6 py-12 text-center text-slate-300 text-sm italic">予約データがありません</td></tr>`;
        return;
      }
      tbody.innerHTML = [...reservations]
        .sort((a,b) => (b.timestamp?.seconds||0) - (a.timestamp?.seconds||0))
        .map(r => `
          <tr class="hover:bg-slate-50/50 transition-colors align-top">
            <td class="px-4 py-4">
              <p class="font-bold text-slate-800 text-sm">${r.customerName}</p>
              <p class="text-[10px] text-slate-400 mt-0.5">${r.timestamp?.toDate?.().toLocaleDateString("ja-JP") ?? ""}</p>
            </td>
            <td class="px-4 py-4">
              <div class="space-y-1">
                ${(r.items||[]).map(it => `
                  <div class="flex items-center gap-2 text-xs">
                    <span class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-600 font-bold">${it.quantity}</span>
                    <span class="text-slate-600">${it.productName}</span>
                  </div>`).join("")}
              </div>
            </td>
            <td class="px-4 py-4 text-right font-bold text-slate-800 text-sm">¥${fmt(r.totalPrice)}</td>
            <td class="px-4 py-4 text-center">
              <button onclick="deleteReservation('${r.id}', '${r.customerName}')"
                class="text-red-400 hover:text-red-600 transition-colors p-1" title="削除">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </td>
          </tr>
        `).join("");

      document.getElementById("reservationCount").textContent = reservations.length;
    }

    // ── 予約削除 ───────────────────────────────────────────────
    window.deleteReservation = async (id, name) => {
      if (!confirm(`「${name}」さんの予約を削除しますか？`)) return;
      try {
        await deleteDoc(doc(db, "artifacts", APP_ID, "public", "data", "reservations", id));
      } catch (e) {
        alert("削除に失敗しました。");
        console.error(e);
      }
    };

    // ── 全データリセット ──────────────────────────────────────
    window.resetAllData = async () => {
      if (!confirm("⚠️ 全ての予約データを削除します。\n次のキャンペーン用にリセットしますか？")) return;
      if (!confirm("本当に削除してよいですか？この操作は取り消せません。")) return;
      try {
        const snap = await getDocs(resRef);
        const batch = writeBatch(db);
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        alert("リセット完了しました。");
      } catch (e) {
        alert("リセットに失敗しました。");
        console.error(e);
      }
    };

    // ── 初回描画 ───────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
      renderForm();
      document.getElementById("customerName").addEventListener("input", renderForm);
    });
  </script>
</head>
<body class="min-h-screen bg-slate-50 font-sans">

  <!-- ナビ -->
  <nav class="bg-white border-b sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <h1 class="font-bold text-lg text-slate-800 truncate">Repeater Fair 2026</h1>
      <div class="flex bg-slate-100 p-1 rounded-lg">
        <button id="tabCustomer" onclick="showTab('customer')"
          class="px-3 py-1.5 rounded-md text-xs font-medium transition-all bg-white shadow-sm text-slate-800">
          予約
        </button>
        <button id="tabAdmin" onclick="showTab('admin')"
          class="px-3 py-1.5 rounded-md text-xs font-medium transition-all text-slate-500">
          管理
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 mt-6 pb-12">

    <!-- ===== パスワード画面 ===== -->
    <div id="passwordView" class="hidden max-w-sm mx-auto mt-16">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center space-y-5">
        <div class="bg-slate-800 w-12 h-12 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h2 class="font-bold text-slate-800 text-lg">スタッフ専用</h2>
        <input id="pwInput" type="password" placeholder="パスワードを入力"
          class="w-full border border-slate-200 rounded-xl px-4 py-3 text-center text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-300"
          onkeydown="if(event.key==='Enter') checkPassword()" />
        <p id="pwError" class="hidden text-red-500 text-sm">パスワードが違います</p>
        <button onclick="checkPassword()"
          class="w-full py-3 bg-slate-800 text-white rounded-xl font-medium hover:bg-slate-700 transition-colors">
          確認する
        </button>
      </div>
    </div>

    <!-- ===== お客様画面 ===== -->
    <div id="customerView">

      <!-- 予約フォーム -->
      <div id="formView" class="max-w-md mx-auto space-y-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
          <!-- 名前 -->
          <div class="flex items-center gap-3 mb-6">
            <div class="bg-slate-800 p-2 rounded-lg text-white">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <div class="flex-1">
              <label class="text-xs font-bold text-slate-400 uppercase">お名前</label>
              <input id="customerName" type="text" placeholder="例：山田 花子"
                class="w-full mt-1 p-0 border-none focus:ring-0 text-lg font-medium placeholder:text-slate-300 outline-none" />
            </div>
          </div>

          <!-- 商品 -->
          <div class="space-y-4">
            <label class="text-xs font-bold text-slate-400 uppercase flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
              </svg>
              商品を選択
            </label>
            <div id="productList" class="space-y-3"></div>
          </div>
        </div>

        <!-- 合計・送信 -->
        <div class="bg-slate-800 rounded-2xl p-6 text-white shadow-xl">
          <div class="flex justify-between items-end mb-4">
            <div>
              <p class="text-slate-400 text-xs uppercase font-bold">合計金額（概算）</p>
              <p id="totalPrice" class="text-3xl font-bold italic">¥0</p>
            </div>
            <div class="text-right">
              <p class="text-slate-400 text-xs font-bold uppercase">合計本数</p>
              <p id="totalCount" class="text-xl font-bold">0本</p>
            </div>
          </div>
          <button id="submitBtn" onclick="submitReservation()" disabled
            class="w-full py-4 bg-white text-slate-800 rounded-xl font-bold text-lg
                   hover:bg-slate-100 disabled:opacity-30 disabled:hover:bg-white
                   transition-all active:scale-95 shadow-lg">
            この内容で予約を確定する
          </button>
          <p class="text-center text-[10px] text-slate-400 mt-4 leading-relaxed">
            ※予約後のキャンセル・変更はお電話にて承ります。<br>
            ※お支払いは7/5以降の店頭受取時となります。
          </p>
        </div>
      </div>

      <!-- サンクス画面 -->
      <div id="thanksView" class="hidden max-w-md mx-auto">
        <div class="bg-white p-8 rounded-3xl shadow-xl text-center space-y-6">
          <div class="flex justify-center">
            <div class="bg-green-100 p-4 rounded-full">
              <svg class="w-16 h-16 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
          </div>
          <h2 class="text-2xl font-bold text-slate-800">ご予約ありがとうございます！</h2>
          <p class="text-slate-600 text-sm">
            ご予約内容を承りました。<br>
            7月5日以降のご来店時に商品をお渡しいたします。<br>
            お会いできるのを楽しみにしております！
          </p>
          <button onclick="closeThanks()"
            class="w-full py-3 bg-slate-800 text-white rounded-xl font-medium hover:bg-slate-700 transition-colors">
            閉じる
          </button>
        </div>
      </div>

    </div><!-- /customerView -->

    <!-- ===== 管理画面 ===== -->
    <div id="adminView" class="hidden space-y-6">

      <!-- 集計カード -->
      <div id="statsGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>

      <!-- 予約台帳 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="p-5 border-b border-slate-50 flex items-center justify-between">
          <h3 class="font-bold text-slate-800 flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            予約台帳（<span id="reservationCount">0</span>名）
          </h3>
          <button onclick="resetAllData()"
